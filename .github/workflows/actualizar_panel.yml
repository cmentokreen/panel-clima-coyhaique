name: Actualizar panel de clima

# Corre 3 veces al día, ya en hora LOCAL de Coyhaique: el campo `timezone`
# le indica a GitHub que ajuste el horario de verano/invierno chileno por
# su cuenta, así que el cron de abajo se lee directo como 7:07, 13:07 y
# 20:07 hora Coyhaique, todo el año, sin cálculo manual de UTC.
#
# Antes esto corría cada hora en punto ("0 * * * *") y el propio script
# filtraba con +/-30 min de margen. El problema: ":00" es el minuto más
# congestionado de todo GitHub Actions, y bajo carga alta la plataforma
# puede descartar corridas programadas ahí sin avisar -- eso era lo que
# estaba dejando el panel sin actualizarse. Disparar solo 3 veces (no 24)
# y en el minuto :07 reduce muchísimo esa chance. El script igual valida
# con +/-30 min como red de seguridad, así que esto no cambia su lógica.
on:
  schedule:
    - cron: "7 7,13,20 * * *"
      timezone: "America/Santiago"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Forzar la corrida aunque no sea 7am/1pm/8pm (para probar)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Levantar servidor local para el render
        run: python -m http.server 8000 &

      - name: Generar panel (si toca a esta hora)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORZAR_EJECUCION: ${{ github.event.inputs.forzar == 'true' && '1' || '' }}
        run: python clima_aysen.py

      - name: Configurar GitHub Pages
        if: hashFiles('docs/panel.bin') != ''
        uses: actions/configure-pages@v5

      - name: Subir docs/ como artifact de Pages
        if: hashFiles('docs/panel.bin') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar en GitHub Pages
        if: hashFiles('docs/panel.bin') != ''
        id: deployment
        uses: actions/deploy-pages@v4